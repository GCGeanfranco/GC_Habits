name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FLASK_SECRET_KEY: dummy-secret-key-for-ci
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret
      GOOGLE_REDIRECT_URI: http://localhost/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run test suite
        run: pytest -v

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=json

      - name: Fail if coverage thresholds are not met
        run: |
          python - <<'EOF'
          import json
          import sys

          thresholds = {
              "app/storage/": 80.0,
              "app/habits/": 100.0,
              "app/web/routes.py": 80.0,
          }

          with open("coverage.json", encoding="utf-8") as f:
              report = json.load(f)

          low = []
          for path, info in report["files"].items():
              normalized = path.replace("\\", "/")
              for prefix, min_pct in thresholds.items():
                  if normalized.startswith(prefix):
                      pct = float(info["summary"]["percent_covered_display"])
                      if pct < min_pct:
                          low.append((path, pct, min_pct))

          if low:
              for path, pct, min_pct in low:
                  print(f"FAIL: {path} coverage {pct}% < {min_pct}%")
              sys.exit(1)

          print("OK: cobertura por archivo cumple umbrales")
          EOF