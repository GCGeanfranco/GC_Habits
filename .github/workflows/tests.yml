name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FLASK_SECRET_KEY: dummy-secret-key-for-ci
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret
      GOOGLE_REDIRECT_URI: http://localhost/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run test suite
        run: pytest -v

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=json

      - name: Fail if app/storage/ coverage is below 80%
        run: |
          python - <<'EOF'
          import json
          import sys

          with open("coverage.json", encoding="utf-8") as f:
              report = json.load(f)

          low = []
          for path, info in report["files"].items():
              normalized = path.replace("\\", "/")
              if normalized.startswith("app/storage/"):
                  pct = float(info["summary"]["percent_covered_display"])
                  if pct < 80:
                      low.append((path, pct))

          if low:
              for path, pct in low:
                  print(f"FAIL: {path} coverage {pct}% < 80%")
              sys.exit(1)

          print("OK: app/storage/ coverage >= 80%")
          EOF